name: Backend CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-test-sonar:
    runs-on: self-hosted

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Java
        shell: powershell
        run: |
          java -version

      - name: Verify Maven Wrapper
        working-directory: backend
        shell: powershell
        run: |
          .\mvnw.cmd -version
     
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
            path: ~/.m2/repository
            key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            restore-keys: |
                ${{ runner.os }}-maven-     
          
      - name: Run tests and generate JaCoCo report
        working-directory: backend
        shell: powershell
        run: |
          .\mvnw.cmd clean org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.13:report

      - name: Verify JaCoCo report
        working-directory: backend
        shell: powershell
        run: |
          if (!(Test-Path ".\user-service\target\jacoco.exec")) {
            Write-Error "JaCoCo execution data was not generated."
            exit 1
          }

          if (!(Test-Path ".\user-service\target\site\jacoco\index.html")) {
            Write-Error "JaCoCo HTML report was not generated."
            exit 1
          }

          Write-Host "JaCoCo report generated successfully."

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/user-service/target/site/jacoco/

      - name: Upload JaCoCo Execution Data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec
          path: backend/user-service/target/jacoco.exec
          
      - name: SonarQube Analysis
        working-directory: backend
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          .\mvnw.cmd org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar "-Dsonar.host.url=http://localhost:9000" "-Dsonar.token=$env:SONAR_TOKEN" "-Dsonar.qualitygate.wait=true"    
          
      - name: Build Docker image
        working-directory: backend
        shell: powershell
        run: |
          # Removed the heavy MAVEN_OPTS build argument entirely
          docker build -t gateway-service -f gateway-service/Dockerfile .

      - name: Run Docker container
        shell: powershell
        run: |
          # Changed tag to match the built 'latest' tag above
          docker run -d --name ai-gateway-hub-gateway-test -p 8080:8080 ai-gateway-hub-gateway:latest

      - name: Wait for application
        shell: powershell
        run: |
          Start-Sleep -Seconds 15

      - name: Docker health check
        shell: powershell
        run: |
          $response = Invoke-RestMethod -Uri "http://localhost:8080/actuator/health"

          Write-Host "Application status: $($response.status)"

          if ($response.status -ne "UP") {
            Write-Error "Application health check failed."
            exit 1
          }

          Write-Host "Docker application health check PASSED."

      - name: Cleanup Docker container
        if: always()
        shell: powershell
        run: |
          docker stop ai-gateway-hub-gateway-test 2>$null
          docker rm ai-gateway-hub-gateway-test 2>$null   
