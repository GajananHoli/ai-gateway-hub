apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway-hub
  namespace: ai-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-gateway-hub
  template:
    metadata:
      labels:
        app: ai-gateway-hub
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: gateway
          image: ghcr.io/gajananholi/ai-gateway-hub-gateway:f4ece3691da040b9ef9e782f2613195025b85e77
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ai-gateway-config
          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"